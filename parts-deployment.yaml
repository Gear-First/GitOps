apiVersion: apps/v1
kind: Deployment
metadata:
  # 이 Deployment의 이름을 정합니다.
  name: parts-service-deployment
spec:
  # 동일한 Pod를 몇 개 실행할지 정합니다. 우선 1개로 시작합니다.
  replicas: 1
  selector:
    matchLabels:
      app: parts-service
  template:
    metadata:
      labels:
        # 이 Pod의 이름표입니다. Service가 이 Pod를 찾아올 때 사용됩니다.
        app: parts-service
    spec:
      containers:
        - name: parts-service-container
          # --- [중요] ---
          # 방금 push한 Docker 이미지의 전체 주소를 여기에 정확하게 입력합니다.
          image: asia-northeast1-docker.pkg.dev/gearfirst/gearfirst-docker-repo/parts-service:1.0
          ports:
            # 스프링 부트 애플리케이션이 사용하는 포트입니다. (보통 8080)
            - containerPort: 8080