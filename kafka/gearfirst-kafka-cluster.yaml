apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
metadata:
  name: gearfirst-kafka-cluster
  namespace: default
spec:
  kafka:
    version: 4.0.0
    # 클러스터 전체의 브로커 설정을 여기에 둡니다.
    config:
      default.replication.factor: 1
      min.insync.replicas: 1
      offsets.topic.replication.factor: 1
      transaction.state.log.replication.factor: 1
      transaction.state.log.min.isr: 1
    listeners:
      # GKE 클러스터 내부 통신용 리스너 (포트 9092)
      - name: plain
        port: 9092
        type: internal
        tls: false
      # 외부 테스트용 리스너 (포트 9094)
      - name: external
        port: 9094
        type: loadbalancer
        tls: false
  entityOperator:
    topicOperator: {}
    userOperator: {}