apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gearfirst-ingress
spec:
  rules:
    - http:
        paths:
          - path: /inventory
            pathType: Prefix
            backend:
              service:
                name: inventory-service
                port:
                  number: 80

          - path: /order
            pathType: Prefix
            backend:
              service:
                name: order-service
                port:
                  number: 80

          - path: /receipt
            pathType: Prefix
            backend:
              service:
                name: receipt-service
                port:
                  number: 80

          - path: /warehouse
            pathType: Prefix
            backend:
              service:
                name: warehouse-service
                port:
                  number: 80